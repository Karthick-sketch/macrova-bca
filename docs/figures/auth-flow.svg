<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#159b8c"/></marker><marker id="arrowGray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#60777b"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#183c38" flood-opacity=".08"/></filter></defs><rect width="100%" height="100%" rx="28" fill="#f7faf9"/><text x="70" y="72" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#16343b">Figure C.2  JWT login and refresh sequence</text><rect x="5" y="130" width="210" height="62" rx="15" fill="#e5f5f2" stroke="#c8dbd7" stroke-width="2"/><text x="110" y="169" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#16343b">USER / BROWSER</text><path d="M110,195 V750" stroke="#c8dbd7" stroke-width="3" stroke-dasharray="9 10"/><rect x="300" y="130" width="210" height="62" rx="15" fill="#e5f5f2" stroke="#c8dbd7" stroke-width="2"/><text x="405" y="169" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#16343b">ANGULAR CLIENT</text><path d="M405,195 V750" stroke="#c8dbd7" stroke-width="3" stroke-dasharray="9 10"/><rect x="640" y="130" width="210" height="62" rx="15" fill="#e5f5f2" stroke="#c8dbd7" stroke-width="2"/><text x="745" y="169" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#16343b">SPRING SECURITY</text><path d="M745,195 V750" stroke="#c8dbd7" stroke-width="3" stroke-dasharray="9 10"/><rect x="985" y="130" width="210" height="62" rx="15" fill="#e5f5f2" stroke="#c8dbd7" stroke-width="2"/><text x="1090" y="169" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#16343b">JWT SERVICE</text><path d="M1090,195 V750" stroke="#c8dbd7" stroke-width="3" stroke-dasharray="9 10"/><path d="M110,235 H397" stroke="#159b8c" stroke-width="3" marker-end="url(#arrow)"/><rect x="122" y="205" width="270" height="25" rx="6" fill="#f7faf9"/><text x="257" y="223" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#16343b">Credentials</text><path d="M405,320 H737" stroke="#159b8c" stroke-width="3" marker-end="url(#arrow)"/><rect x="440" y="290" width="270" height="25" rx="6" fill="#f7faf9"/><text x="575" y="308" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#16343b">Username + password</text><path d="M745,405 H1082" stroke="#159b8c" stroke-width="3" marker-end="url(#arrow)"/><rect x="782" y="375" width="270" height="25" rx="6" fill="#f7faf9"/><text x="917" y="393" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#16343b">sign refresh token</text><path d="M745,490 H1082" stroke="#60777b" stroke-width="3" marker-end="url(#arrowGray)"/><rect x="782" y="460" width="270" height="25" rx="6" fill="#f7faf9"/><text x="917" y="478" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#16343b">signed refresh token</text><path d="M110,575 H737" stroke="#60777b" stroke-width="3" marker-end="url(#arrowGray)"/><rect x="292" y="545" width="270" height="25" rx="6" fill="#f7faf9"/><text x="427" y="563" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#16343b">refresh cookie</text><path d="M110,660 H1082" stroke="#159b8c" stroke-width="3" marker-end="url(#arrow)"/><rect x="465" y="630" width="270" height="25" rx="6" fill="#f7faf9"/><text x="600" y="648" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#16343b">access-token request</text><path d="M745,745 H1082" stroke="#60777b" stroke-width="3" marker-end="url(#arrowGray)"/><rect x="782" y="715" width="270" height="25" rx="6" fill="#f7faf9"/><text x="917" y="733" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#16343b">verify signature + exp</text><path d="M110,830 H737" stroke="#60777b" stroke-width="3" marker-end="url(#arrowGray)"/><rect x="292" y="800" width="270" height="25" rx="6" fill="#f7faf9"/><text x="427" y="818" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#16343b">short-lived access token</text><text x="90" y="790" font-family="Arial,sans-serif" font-size="15" fill="#60777b">Token lifetime in source: access 1 hour • refresh 24 hours. Production cookie/CORS settings require deployment review.</text></svg>