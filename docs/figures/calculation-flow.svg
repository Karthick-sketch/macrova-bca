<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#159b8c"/></marker><marker id="arrowGray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#60777b"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#183c38" flood-opacity=".08"/></filter></defs><rect width="100%" height="100%" rx="28" fill="#f7faf9"/><text x="70" y="72" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#16343b">Figure C.4  Energy and macronutrient calculation pipeline</text><g filter="url(#shadow)"><rect x="70" y="230" width="220" height="205" rx="18" fill="#ffffff" stroke="#c8dbd7" stroke-width="2"/><path d="M88,230 h184" stroke="#159b8c" stroke-width="7" stroke-linecap="round"/></g><text x="94" y="278" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#16343b">PROFILE INPUT</text><text x="94" y="316" font-family="Arial,sans-serif" font-size="17" fill="#60777b">age • height • weight</text><text x="94" y="345" font-family="Arial,sans-serif" font-size="17" fill="#60777b">gender • activity</text><g filter="url(#shadow)"><rect x="330" y="230" width="220" height="205" rx="18" fill="#ffffff" stroke="#c8dbd7" stroke-width="2"/><path d="M348,230 h184" stroke="#558edb" stroke-width="7" stroke-linecap="round"/></g><text x="354" y="278" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#16343b">BMR ESTIMATE</text><text x="354" y="316" font-family="Arial,sans-serif" font-size="17" fill="#60777b">10W + 6.25H − 5A + S</text><text x="354" y="345" font-family="Arial,sans-serif" font-size="17" fill="#60777b">Mifflin–St Jeor form</text><g filter="url(#shadow)"><rect x="590" y="230" width="220" height="205" rx="18" fill="#ffffff" stroke="#c8dbd7" stroke-width="2"/><path d="M608,230 h184" stroke="#558edb" stroke-width="7" stroke-linecap="round"/></g><text x="614" y="278" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#16343b">TDEE ESTIMATE</text><text x="614" y="316" font-family="Arial,sans-serif" font-size="17" fill="#60777b">BMR × activity factor</text><text x="614" y="345" font-family="Arial,sans-serif" font-size="17" fill="#60777b">five configured levels</text><g filter="url(#shadow)"><rect x="850" y="230" width="220" height="205" rx="18" fill="#ffffff" stroke="#c8dbd7" stroke-width="2"/><path d="M868,230 h184" stroke="#e6a23c" stroke-width="7" stroke-linecap="round"/></g><text x="874" y="278" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#16343b">GOAL TARGET</text><text x="874" y="316" font-family="Arial,sans-serif" font-size="17" fill="#60777b">deficit / surplus</text><text x="874" y="345" font-family="Arial,sans-serif" font-size="17" fill="#60777b">goal intensity • rounding</text><g filter="url(#shadow)"><rect x="1110" y="230" width="220" height="205" rx="18" fill="#ffffff" stroke="#c8dbd7" stroke-width="2"/><path d="M1128,230 h184" stroke="#159b8c" stroke-width="7" stroke-linecap="round"/></g><text x="1134" y="278" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#16343b">MACRO + MEALS</text><text x="1134" y="316" font-family="Arial,sans-serif" font-size="17" fill="#60777b">protein 30% • fat 30%</text><text x="1134" y="345" font-family="Arial,sans-serif" font-size="17" fill="#60777b">carbs 40% • meal split</text><path d="M290,330 L330,330" fill="none" stroke="#159b8c" stroke-width="4" marker-end="url(#arrow)"/><path d="M550,330 L590,330" fill="none" stroke="#159b8c" stroke-width="4" marker-end="url(#arrow)"/><path d="M810,330 L850,330" fill="none" stroke="#159b8c" stroke-width="4" marker-end="url(#arrow)"/><path d="M1070,330 L1110,330" fill="none" stroke="#159b8c" stroke-width="4" marker-end="url(#arrow)"/><rect x="90" y="535" width="1220" height="145" rx="18" fill="#fffaf0" stroke="#efd9aa" stroke-width="2"/><text x="120" y="580" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#775617">Interpretation note</text><text x="120" y="618" font-family="Arial,sans-serif" font-size="17" fill="#775617">Outputs are estimates based on entered values and configured heuristics; rounding and individual variation apply.</text><text x="120" y="650" font-family="Arial,sans-serif" font-size="16" fill="#775617">Not a diagnosis, therapeutic diet, or substitute for advice from a qualified health professional.</text></svg>